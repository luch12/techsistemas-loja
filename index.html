<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Salvaterra - Notícias Culturais</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial; background: #e6f7ff; }
        header { background: linear-gradient(135deg, #0066cc, #004a99); color: white; padding: 25px 15px; text-align: center; }
        header h1 { font-size: 28px; }
        header p { font-size: 14px; opacity: 0.9; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .noticia { background: white; padding: 20px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
        .noticia img, .noticia video, .noticia iframe { width: 100%; border-radius: 8px; margin: 15px 0; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin: 15px 0; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .noticia h2 { color: #0066cc; margin-bottom: 8px; font-size: 22px; }
        .data { color: #888; font-size: 13px; margin-bottom: 10px; }
        .texto-noticia { 
            text-align: justify !important; 
            text-justify: inter-word !important;
            line-height: 1.7 !important; 
            color: #333 !important; 
            font-size: 16px !important; 
            display: block;
        }
        footer { text-align: center; padding: 20px; color: #777; font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <h1>🌴 Guia Salvaterra</h1>
        <p>Notícias Culturais e Eventos de Salvaterra - PA</p>
    </header>

    <div class="container" id="noticias">
        <p style="text-align:center; padding:40px;">Carregando notícias...</p>
    </div>

    <footer>
        © 2026 Guia Salvaterra
    </footer>

    <script>
        fetch('noticias.json?v=' + new Date().getTime())
        .then(res => res.json())
        .then(dados => {
            document.getElementById('noticias').innerHTML = dados.map(n => `
                <div class="noticia">
                    <h2>${n.titulo}</h2>
                    <div class="data">${n.data}</div>
                    ${n.imagem ? `<img src="${n.imagem}" alt="${n.titulo}">` : ''}
                    ${n.video ? 
                        n.video.includes('youtube.com') || n.video.includes('youtu.be') 
                        ? `<div class="video-wrapper"><iframe src="${n.video}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>` 
                        : `<video src="${n.video}" controls playsinline></video>` 
                        : ''}
                    <div class="texto-noticia">${n.texto.replace(/\n/g, '<br>')}</div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
